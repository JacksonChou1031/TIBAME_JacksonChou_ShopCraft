spring:
  application:
    name: ecommerce
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1435;databaseName=ecommerce;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:ecommerce_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration: ${JWT_EXPIRATION:30m}
    cookie-secure: ${COOKIE_SECURE:false}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
  initial-admin:
    email: ${INITIAL_ADMIN_EMAIL}
    username: ${INITIAL_ADMIN_USERNAME}
    password: ${INITIAL_ADMIN_PASSWORD}
    display-name: ${INITIAL_ADMIN_DISPLAY_NAME}
    phone: ${INITIAL_ADMIN_PHONE}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    group:
      readiness:
        include: readinessState,db
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Interview MVP ecommerce application
