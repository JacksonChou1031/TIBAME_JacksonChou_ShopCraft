<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ecommerce 商品展示</title>
  <style>
    body { max-width: 980px; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; color: #243047; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    form, article { border: 1px solid #d9e0ea; border-radius: 10px; padding: 1rem; margin: 1rem 0; }
    input, textarea, button { box-sizing: border-box; padding: .6rem; margin: .25rem 0; font: inherit; }
    input, textarea { width: 100%; } button { cursor: pointer; }
    #products { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    article { margin: 0; } article img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; }
    .muted { color: #68758a; } .error { color: #b42318; } .ok { color: #087443; }
    .hidden { display: none; }
    .cart-item { display: flex; align-items: center; justify-content: space-between; gap: .75rem; border-top: 1px solid #e8edf4; padding: .6rem 0; }
    .cart-item input { width: 5rem; }
  </style>
</head>
<body>
  <header>
    <h1>Demo 商品展示</h1>
    <span id="message" class="muted">載入商品中…</span>
  </header>

  <form id="login-form">
    <h2>會員登入</h2>
    <input id="identifier" placeholder="Email 或 username" required>
    <input id="password" type="password" placeholder="密碼" required>
    <button>登入</button>
    <button type="button" id="logout">登出</button>
  </form>

  <form id="product-form" class="hidden">
    <h2>新增商品（賣方 Demo）</h2>
    <input id="name" placeholder="商品名稱" required maxlength="200">
    <textarea id="description" placeholder="商品描述" required maxlength="5000"></textarea>
    <input id="price" type="number" min="0" step="0.01" placeholder="價格（TWD）" required>
    <input id="stock" type="number" min="0" step="1" placeholder="庫存" required>
    <input id="category" placeholder="分類" required maxlength="100">
    <input id="image" type="file" accept="image/jpeg,image/png,image/webp">
    <button>建立商品</button>
  </form>

  <section>
    <h2>商品列表</h2>
    <div id="products"></div>
  </section>

  <section id="cart-section" class="hidden">
    <h2>我的購物車</h2>
    <div id="cart-items"></div>
    <p id="cart-summary" class="muted"></p>
    <button type="button" id="clear-cart">清空購物車</button>
  </section>

  <form id="checkout-form" class="hidden">
    <h2>模擬結帳</h2>
    <select id="shipping-method">
      <option value="HOME_DELIVERY">宅配到府（TWD 100）</option>
      <option value="CONVENIENCE_STORE">超商取貨（TWD 60）</option>
    </select>
    <input id="recipient-name" placeholder="收件人姓名" required>
    <input id="recipient-phone" placeholder="收件人電話" required>
    <input id="store-name" placeholder="超商名稱（超商取貨必填）">
    <input id="store-code" placeholder="門市代碼（超商取貨必填）">
    <input id="delivery-address" placeholder="宅配地址（宅配必填）">
    <input id="mock-account-name" value="Demo Payment Account" placeholder="模擬帳戶名稱" required>
    <select id="mock-account-number">
      <option value="MOCK_SUCCESS">MOCK_SUCCESS（付款成功）</option>
      <option value="MOCK_FAILURE">MOCK_FAILURE（付款失敗）</option>
    </select>
    <input id="idempotency-key" placeholder="Idempotency-Key" required>
    <button>模擬付款並結帳</button>
  </form>

  <script>
    const message = document.querySelector('#message');
    const products = document.querySelector('#products');
    const loginIdentifier = document.querySelector('#identifier');
    const loginPassword = document.querySelector('#password');
    const productName = document.querySelector('#name');
    const productDescription = document.querySelector('#description');
    const productPrice = document.querySelector('#price');
    const productStock = document.querySelector('#stock');
    const productCategory = document.querySelector('#category');
    const productImage = document.querySelector('#image');
    const cartSection = document.querySelector('#cart-section');
    const cartItems = document.querySelector('#cart-items');
    const cartSummary = document.querySelector('#cart-summary');
    const checkoutForm = document.querySelector('#checkout-form');
    const shippingMethod = document.querySelector('#shipping-method');
    const recipientName = document.querySelector('#recipient-name');
    const recipientPhone = document.querySelector('#recipient-phone');
    const storeName = document.querySelector('#store-name');
    const storeCode = document.querySelector('#store-code');
    const deliveryAddress = document.querySelector('#delivery-address');
    const mockAccountName = document.querySelector('#mock-account-name');
    const mockAccountNumber = document.querySelector('#mock-account-number');
    const idempotencyKey = document.querySelector('#idempotency-key');
    idempotencyKey.value = `browser-checkout-${Date.now()}`;
    const cookie = name => document.cookie.split('; ').find(row => row.startsWith(name + '='))?.split('=')[1];
    const show = (text, type = 'muted') => { message.textContent = text; message.className = type; };

    async function csrf() {
      await fetch('/api/v1/auth/csrf', { credentials: 'same-origin' });
      return decodeURIComponent(cookie('XSRF-TOKEN') || '');
    }

    async function request(url, options = {}) {
      const token = await csrf();
      options.credentials = 'same-origin';
      options.headers = { ...(options.headers || {}), 'X-XSRF-TOKEN': token };
      return fetch(url, options);
    }

    async function responseMessage(response, fallback) {
      try {
        const data = await response.json();
        return data.message ? `${fallback}（${data.message}）` : `${fallback}（HTTP ${response.status}）`;
      } catch (_) {
        return `${fallback}（HTTP ${response.status}）`;
      }
    }

    async function loadProducts() {
      const response = await fetch('/api/v1/products?size=50');
      const data = await response.json();
      products.innerHTML = data.items.map(product => `
        <article>
          ${product.images[0] ? `<img src="${product.images[0].url}" alt="${escapeHtml(product.name)}">` : ''}
          <h3>${escapeHtml(product.name)}</h3>
          <p>${escapeHtml(product.description)}</p>
          <strong>${product.price} ${product.currency}</strong>
          <p class="muted">分類：${escapeHtml(product.category)}｜庫存：${product.stock === 0 ? '售罄' : product.stock}</p>
          <button type="button" onclick="addToCart(${product.id})" ${product.stock === 0 ? 'disabled' : ''}>加入購物車</button>
        </article>`).join('') || '<p class="muted">目前沒有商品。</p>';
    }

    const escapeHtml = value => String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

    document.querySelector('#login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const response = await request('/api/v1/auth/login', { method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ identifier: loginIdentifier.value, password: loginPassword.value }) });
      if (!response.ok) { show(await responseMessage(response, '登入失敗'), 'error'); return; }
      document.querySelector('#product-form').classList.remove('hidden');
      cartSection.classList.remove('hidden');
      checkoutForm.classList.remove('hidden');
      await loadCart();
      show('登入成功，可以新增商品。', 'ok');
    });

    document.querySelector('#logout').addEventListener('click', async () => {
      await request('/api/v1/auth/logout', { method: 'POST' });
      document.querySelector('#product-form').classList.add('hidden');
      cartSection.classList.add('hidden');
      checkoutForm.classList.add('hidden');
      show('已登出。');
    });

    document.querySelector('#product-form').addEventListener('submit', async event => {
      event.preventDefault();
      const response = await request('/api/v1/products', { method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name: productName.value, description: productDescription.value, price: productPrice.value,
          stock: Number(productStock.value), category: productCategory.value }) });
      if (!response.ok) { show(await responseMessage(response, '建立商品失敗'), 'error'); return; }
      const product = await response.json();
      const file = productImage.files[0];
      if (file) {
        const data = new FormData();
        data.append('file', file);
        const uploadResponse = await request(`/api/v1/products/${product.id}/images`, { method: 'POST', body: data });
        if (!uploadResponse.ok) { show(await responseMessage(uploadResponse, '商品已建立，但圖片上傳失敗'), 'error'); return; }
      }
      event.target.reset(); await loadProducts(); show('商品建立成功。', 'ok');
    });

    async function addToCart(productId) {
      const response = await request('/api/v1/cart/items', { method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ productId, quantity: 1 }) });
      if (!response.ok) { show(await responseMessage(response, '加入購物車失敗'), 'error'); return; }
      await renderCart(await response.json()); show('已加入購物車。', 'ok');
    }

    async function loadCart() {
      const response = await fetch('/api/v1/cart', { credentials: 'same-origin' });
      if (response.ok) await renderCart(await response.json());
    }

    async function renderCart(cart) {
      cartItems.innerHTML = cart.items.map(item => `
        <div class="cart-item">
          <span>${escapeHtml(item.productName)}｜${item.currentUnitPrice} ${item.currency}</span>
          <input type="number" min="1" value="${item.quantity}" onchange="updateCartItem(${item.productId}, this.value)">
          <span>${item.purchasable ? '可購買' : '不可購買：' + item.unavailableReason}</span>
          <button type="button" onclick="removeCartItem(${item.productId})">移除</button>
        </div>`).join('') || '<p class="muted">購物車是空的。</p>';
      cartSummary.textContent = `目前金額：${cart.currentTotal}｜${cart.checkoutReady ? '可以結帳' : '有商品暫不可購買'}`;
    }

    async function updateCartItem(productId, quantity) {
      const response = await request(`/api/v1/cart/items/${productId}`, { method: 'PATCH', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ quantity: Number(quantity) }) });
      if (!response.ok) { show(await responseMessage(response, '更新購物車失敗'), 'error'); await loadCart(); return; }
      await renderCart(await response.json());
    }

    async function removeCartItem(productId) {
      const response = await request(`/api/v1/cart/items/${productId}`, { method: 'DELETE' });
      if (!response.ok) { show(await responseMessage(response, '移除購物車明細失敗'), 'error'); return; }
      await loadCart();
    }

    document.querySelector('#clear-cart').addEventListener('click', async () => {
      const response = await request('/api/v1/cart', { method: 'DELETE' });
      if (response.ok) await loadCart();
    });

    checkoutForm.addEventListener('submit', async event => {
      event.preventDefault();
      const response = await request('/api/v1/checkout', { method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ shippingMethod: shippingMethod.value, recipientName: recipientName.value,
          recipientPhone: recipientPhone.value, storeName: storeName.value || null, storeCode: storeCode.value || null,
          deliveryAddress: deliveryAddress.value || null, mockAccountName: mockAccountName.value,
          mockAccountNumber: mockAccountNumber.value }) });
      if (!response.ok) { show(await responseMessage(response, '結帳失敗'), 'error'); return; }
      const result = await response.json();
      await loadCart(); await loadProducts();
      show(`結帳成功，訂單編號：${result.orderId}`, 'ok');
    });

    loadProducts().catch(() => show('商品載入失敗，請確認 Spring Boot 已啟動。', 'error'));
  </script>
</body>
</html>
